plugins {
    id 'java-library'
    id 'maven-publish'
    // Match Create 6.0.8's own 1.20.1 toolchain so all runtime mods are
    // remapped into the same development namespace.
    id 'net.neoforged.moddev.legacyforge' version '2.0.107'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://modmaven.dev/' }
    maven { url = 'https://maven.blamejared.com' }
}

base {
    archivesName = mod_id
}

// Minecraft 1.20.1 and Forge 47 target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional compatibility target, present only in the development runtime.
    modImplementation 'maven.modrinth:create-sifting:1.20.1-1.8.6-6.0.6'
    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    modImplementation "net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"
    modCompileOnly "dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"
    modRuntimeOnly "dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"
    modRuntimeOnly "dev.engine-room.vanillin:vanillin-forge-${minecraft_version}:${vanillin_version}"
    modImplementation "com.tterrag.registrate:Registrate:${registrate_version}"
    implementation "io.github.llamalad7:mixinextras-forge:${mixin_extras_version}"

    // Mekanism supplies the power/logistics ecosystem this addon is designed for.
    modImplementation "mekanism:Mekanism:${mekanism_version}"

    // JEI is optional for players, but available in development for recipe-integration testing.
    modImplementation "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            create_version         : create_version,
            mekanism_version       : mekanism_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
legacyForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Every placeable block must have both a loot table and an appropriate mining
// tag. Missing the latter makes Mekanism-style machine blocks silently drop
// nothing even when their loot table exists.
def blockstatesDirectory = file("src/main/resources/assets/${mod_id}/blockstates")
def blockLootDirectory = file("src/main/resources/data/${mod_id}/loot_tables/blocks")
def pickaxeTagFile = file("src/main/resources/data/minecraft/tags/blocks/mineable/pickaxe.json")
def validatedModId = mod_id.toString()
def blockstateFiles = fileTree(blockstatesDirectory) {
    include '*.json'
}
def blockLootFiles = fileTree(blockLootDirectory) {
    include '*.json'
}

tasks.register('validateBlockDrops') {
    group = 'verification'
    description = 'Checks that every blockstate has a loot table and is mineable with a pickaxe.'
    inputs.files(blockstateFiles)
    inputs.files(blockLootFiles)
    inputs.file(pickaxeTagFile)

    doLast {
        def blockIds = blockstateFiles.files.collect {
            it.name.substring(0, it.name.length() - '.json'.length())
        }.toSet()
        def lootIds = blockLootFiles.files.collect {
            it.name.substring(0, it.name.length() - '.json'.length())
        }.toSet()
        def pickaxeTag = new groovy.json.JsonSlurper().parse(pickaxeTagFile)
        def pickaxeIds = pickaxeTag.values.findAll {
            it instanceof String && it.startsWith("${validatedModId}:")
        }.collect { it.substring(it.indexOf(':') + 1) }.toSet()

        def missingLoot = blockIds - lootIds
        def missingPickaxeTags = blockIds - pickaxeIds
        if (!missingLoot.empty || !missingPickaxeTags.empty) {
            throw new GradleException("Invalid block drops. Missing loot tables: ${missingLoot.sort()}; missing pickaxe tags: ${missingPickaxeTags.sort()}")
        }
    }
}

def recipeFiles = fileTree('src/main/resources/data') {
    include '**/recipes/**/*.json'
}

tasks.register('validateLegacyForgeRecipeTags') {
    group = 'verification'
    description = 'Rejects NeoForge c: item tags accidentally copied into the Minecraft 1.20.1 Forge branch.'
    inputs.files(recipeFiles)

    doLast {
        def invalidFiles = recipeFiles.files.findAll {
            it.getText('UTF-8') =~ /"tag"\s*:\s*"c:/
        }.collect { project.relativePath(it) }
        if (!invalidFiles.empty) {
            throw new GradleException("Minecraft 1.20.1 recipes must use Forge tags, but c: tags were found in: ${invalidFiles.sort()}")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('validateBlockDrops')
    dependsOn tasks.named('validateLegacyForgeRecipeTags')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
